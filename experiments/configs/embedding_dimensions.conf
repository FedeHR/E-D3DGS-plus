# E-D3DGS Embedding Dimensions Comparison
# Tests different gaussian and temporal embedding dimensions
# Dataset types are auto-detected from scene names

# Baseline (default dimensions)
--scene cut_roasted_beef

# Small dimensions
--scene cut_roasted_beef --gdim 8 --tdim 64
--scene cut_roasted_beef --gdim 16 --tdim 128

# Large dimensions  
--scene cut_roasted_beef --gdim 64 --tdim 512
--scene cut_roasted_beef --gdim 128 --tdim 1024

# Mixed dimensions
--scene cut_roasted_beef --gdim 8 --tdim 256
--scene cut_roasted_beef --gdim 32 --tdim 128

# HyperNeRF scene with different dimensions
--scene vrig-chicken --gdim 8 --tdim 128
--scene vrig-chicken --gdim 64 --tdim 512 